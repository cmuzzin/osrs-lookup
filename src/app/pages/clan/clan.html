<div class="page-shell">
  <div class="page-shell__topbar">
    <a class="page-shell__brand" routerLink="/">⚔️ OSRS Stat Lookup</a>
    <app-search-bar placeholder="Look up a player…" />
  </div>

  @if (loading()) {
    <div class="page-shell__status panel">
      <div class="spinner" aria-hidden="true"></div>
      <p>Fetching clan stats…</p>
    </div>
  } @else if (error()) {
    <div class="page-shell__status page-shell__status--error panel">
      <p>{{ error() }}</p>
      @if (numericId() !== null) {
        <button type="button" class="retry-btn" (click)="retry()">Try again</button>
      }
    </div>
  } @else if (group(); as g) {
    <app-clan-header [group]="g" />

    <section class="page-shell__section">
      <app-clan-stats [clanId]="g.id" />
    </section>

    <section class="page-shell__section">
      <app-clan-leaderboard [clanId]="g.id" />
    </section>

    <section class="page-shell__section">
      <app-clan-gainers [clanId]="g.id" />
    </section>
  }
</div>
