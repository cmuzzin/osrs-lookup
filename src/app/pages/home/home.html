<section class="hero">
  <div class="hero-body">
    <div class="container has-text-centered">
      <p class="is-size-1 mb-2" aria-hidden="true">⚔️</p>
      <h1 class="title">RuneTools</h1>
      <p class="subtitle has-text-grey">A growing set of tools for Old School RuneScape players and clans.</p>
    </div>
  </div>
</section>

<section class="container pb-6">
  <div class="grid is-col-min-12 home__features">
    @for (f of features; track f.route) {
      <a class="cell box home__feature-card" [routerLink]="f.route">
        <p class="is-size-2 mb-2" aria-hidden="true">{{ f.icon }}</p>
        <h2 class="title is-5 mb-1">{{ f.title }}</h2>
        <p class="has-text-grey">{{ f.description }}</p>
      </a>
    }
  </div>
</section>
