<section class="panel xp-chart">
  <header class="xp-chart__header">
    <h3>XP Progress</h3>
    <div class="xp-chart__controls">
      <select
        class="xp-chart__metric"
        aria-label="Skill"
        [value]="metric()"
        (change)="setMetric($any($event.target).value)"
      >
        @for (opt of skillOptions(); track opt.key) {
          <option [value]="opt.key">{{ opt.icon }} {{ opt.label }}</option>
        }
      </select>
      <div class="xp-chart__periods">
        @for (p of periods; track p.value) {
          <button
            type="button"
            class="period-btn"
            [class.is-active]="period() === p.value"
            (click)="setPeriod(p.value)"
          >
            {{ p.label }}
          </button>
        }
      </div>
    </div>
  </header>

  @if (loading()) {
    <p class="xp-chart__status">Loading chart…</p>
  } @else if (error()) {
    <p class="xp-chart__status xp-chart__status--error">{{ error() }}</p>
  } @else {
    <app-trend-chart [points]="points()" unit="xp" />
  }
</section>
